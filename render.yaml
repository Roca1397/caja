services:
  - type: web
    name: consultas-siniestros-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python cargar_datos.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siniestros-demo-db
          property: connectionString
      - key: ASESOR_WSP
        value: "51999999999"
databases:
  - name: siniestros-demo-db
    plan: free
